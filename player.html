<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz NBC 540 e 550</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f2352;--panel:#2c3275;--text:#fff7e6;--muted:#b9bdf0;--yellow:#ffd23f;--pink:#ff5d8f;--mint:#3ddc97;--blue:#4cc9f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:500 17px/1.4 Nunito,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,.big{font-family:'Baloo 2',system-ui,sans-serif;margin:0;font-weight:800;line-height:1.1}
#app{max-width:520px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:10px 14px;margin-bottom:14px}
.dot{width:34px;height:34px;border-radius:50%;flex:none}
.top .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-family:'Baloo 2';font-weight:800;font-size:24px;color:var(--yellow)}
.rk{color:var(--muted);font-size:14px}
.card{background:var(--panel);border-radius:18px;padding:18px;margin-bottom:14px}
.center{text-align:center}
input{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:3px solid var(--panel);background:#fff;color:#1f2352;margin:12px 0}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;color:#1f2352;background:var(--yellow);width:100%}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.5}
.opt{display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:10px;background:#fff7e6;font-size:17px;padding:14px}
.opt b{flex:none;width:34px;height:34px;border-radius:10px;background:#1f2352;color:#fff7e6;display:grid;place-items:center}
.opt.ok{background:var(--mint)}.opt.bad{background:var(--pink)}.opt.dim{opacity:.45}
.bar{height:10px;background:#1f2352;border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--yellow);width:100%}
.tag{display:inline-block;border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px;background:var(--pink);color:#fff}
.banner{background:#4b1d52;border:2px dashed var(--pink);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.rank{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff22}
.rank .dot{width:22px;height:22px}.rank span:nth-child(2){flex:1}
.pw{background:#3a2f8f;margin-bottom:8px;color:var(--text)}
.pw.sel{background:var(--yellow);color:#1f2352}
.tg{background:#fff7e6;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.err{color:var(--pink);font-weight:700;min-height:24px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s linear}}
</style></head><body><div id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json().catch(()=>({})));
let me=null,S=null,myChoice=null,lastQ=-2,offset=0,power=null,es=null,err='',rejoined=false;
try{me=JSON.parse(localStorage.getItem('quizme'))}catch(e){}

function connect(){
  if(es)es.close();
  es=new EventSource('/events?id='+me.id);
  es.onmessage=e=>{
    S=JSON.parse(e.data);offset=S.now-Date.now();
    if(!S.players.some(p=>p.id===me.id)&&!rejoined){rejoined=true;post('/api/join',{name:me.name}).then(r=>{if(r.id){me=r;localStorage.setItem('quizme',JSON.stringify(me));connect()}});}
    if(S.q!==lastQ){lastQ=S.q;myChoice=null;power=null}
    render();
  };
}
async function join(){
  const name=$('nm').value.trim();
  const r=await post('/api/join',{name});
  if(r.error){err=r.error;return render()}
  me=r;localStorage.setItem('quizme',JSON.stringify(me));connect();
}
function answer(i){myChoice=i;post('/api/answer',{id:me.id,choice:i});render()}
function usePower(t){post('/api/power',{id:me.id,power:power,target:t})}

function top(mine,rank){
  return `<div class="top"><div class="dot" style="background:${mine.color}"></div><div class="n">${esc(mine.name)}<div class="rk">${rank}º lugar</div></div><div class="pts">${mine.points}</div></div>`;
}
function ranking(list,n){
  return [...list].sort((a,b)=>b.points-a.points).slice(0,n).map((p,i)=>`<div class="rank"><span>${i+1}º</span><span><i class="dot" style="background:${p.color};display:inline-block;vertical-align:middle;margin-right:8px"></i>${esc(p.name)}${p.id===me.id?' (você)':''}</span><b>${p.points}</b></div>`).join('');
}
function render(){
  const app=$('app');
  if(!me||!S){
    if(me)return;
    app.innerHTML=`<div class="card center"><h1 class="big" style="font-size:34px">Quiz NBC 540 e 550</h1><p>Entre na sala e mostre quem domina estimativas contábeis e partes relacionadas.</p><input id="nm" maxlength="16" placeholder="Seu nome" autocomplete="off"><div class="err">${esc(err)}</div><button onclick="join()">Entrar no jogo</button></div>`;
    return;
  }
  const mine=S.players.find(p=>p.id===me.id);
  if(!mine){app.innerHTML='<div class="card center">Entrando na sala…</div>';return}
  const sorted=[...S.players].sort((a,b)=>b.points-a.points);
  const rank=sorted.findIndex(p=>p.id===me.id)+1;
  let h=top(mine,rank);
  if(mine.allin&&S.phase!=='ended')h+=`<div class="banner">🎲 <b>Tudo ou nada!</b> Na próxima pergunta, acerte e seus pontos dobram. Errar zera tudo.</div>`;
  const q=S.question;
  if(S.phase==='lobby'){
    h+=`<div class="card center"><h2>Você está dentro!</h2><p>Aguarde: o professor vai iniciar o jogo.</p><p class="rk">${S.players.length} de ${S.max} jogadores na sala</p></div>`;
  }else if(S.phase==='question'){
    h+=`<div class="bar"><i id="bar"></i></div><div class="card"><div class="rk">Pergunta ${S.q+1} de ${S.total} · vale ${q.points} pts</div><h2 style="font-size:24px;margin-top:6px">${esc(q.text)}</h2></div>`;
    if(mine.blocked)h+=`<div class="card center"><h2>🚫 Você foi bloqueado</h2><p>Sem resposta nesta rodada.</p></div>`;
    else if(myChoice!==null||mine.answered)h+=`<div class="card center"><h2>Resposta enviada ✔</h2><p>Aguardando os outros jogadores…</p></div>`;
    else h+=q.options.map((o,i)=>`<button class="opt" onclick="answer(${i})"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('');
  }else if(S.phase==='reveal'){
    const win=S.players.find(p=>p.id===S.firstId);
    const right=myChoice===q.correct;
    h+=`<div class="card"><h2 style="font-size:22px">${esc(q.text)}</h2></div>`;
    h+=q.options.map((o,i)=>`<div class="opt ${i===q.correct?'ok':(i===myChoice?'bad':'dim')}" style="border-radius:14px"><b>${'ABCD'[i]}</b>${esc(o)}</div>`).join('');
    h+=`<div class="card center"><h2>${myChoice===null?'Sem resposta ⏱':right?'Acertou! 🎉':'Errou 😬'}</h2>${win?`<p>⚡ ${win.id===me.id?'Você foi':esc(win.name)+' foi'} o mais rápido a acertar.</p>`:'<p>Ninguém acertou.</p>'}</div>`;
    if(S.powerFor===me.id){
      const names={block:'🚫 Bloquear (some da próxima pergunta)',zero:'💣 Zerar os pontos',steal:'🥷 Roubar metade dos pontos'};
      h+=`<div class="card"><h3>Você ganhou um poder!</h3><p>Escolha o poder e depois o alvo:</p>`+Object.keys(names).map(k=>`<button class="pw ${power===k?'sel':''}" onclick="power='${k}';render()">${names[k]}</button>`).join('');
      if(power)h+=S.players.filter(p=>p.id!==me.id).map(p=>`<button class="tg" onclick="usePower('${p.id}')"><i class="dot" style="background:${p.color};width:22px;height:22px"></i>${esc(p.name)} <span style="margin-left:auto">${p.points} pts</span></button>`).join('');
      h+=`</div>`;
    }
    h+=`<div class="card"><h3>Placar</h3>${ranking(S.players,5)}</div><p class="center rk">Aguarde a próxima pergunta…</p>`;
  }else{
    h+=`<div class="card center"><h1 class="big" style="font-size:32px">Fim de jogo!</h1><p>Você ficou em ${rank}º lugar com ${mine.points} pontos.</p></div><div class="card"><h3>Placar final</h3>${ranking(S.players,25)}</div>`;
  }
  app.innerHTML=h;
}
setInterval(()=>{
  const b=$('bar');
  if(b&&S&&S.phase==='question'){const left=S.endsAt-(Date.now()+offset);b.style.width=Math.max(0,Math.min(100,left/(S.question.time*10)))+'%'}
},250);
if(me)connect();render();
</script></body></html>
